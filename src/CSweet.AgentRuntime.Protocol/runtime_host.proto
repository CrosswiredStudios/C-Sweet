syntax = "proto3";

option csharp_namespace = "CSweet.AgentRuntime.Protocol";
package csweet.runtimehost.v1;

message RuntimeHostEnvelope {
  string protocol_version = 1;
  string request_id = 2;
  string authentication_key_id = 3;
  int64 authentication_timestamp_unix_seconds = 4;
  bytes authentication_nonce = 5;
  bytes authentication_signature = 6;
  oneof body {
    ProbeRequest probe_request = 10;
    ProbeResponse probe_response = 11;
    CreateWorkloadRequest create_request = 12;
    WorkloadHandleResponse create_response = 13;
    WorkloadOperationRequest start_request = 14;
    WorkloadOperationRequest inspect_request = 15;
    WorkloadStatusResponse inspect_response = 16;
    StopWorkloadRequest stop_request = 17;
    WorkloadOperationRequest destroy_request = 18;
    OperationResponse operation_response = 19;
    ReadLogsRequest read_logs_request = 20;
    LogChunk log_chunk = 21;
  }
}

message ProbeRequest {
  string provider_id = 1;
}

message ProbeResponse {
  string provider_id = 1;
  string provider_version = 2;
  string host_operating_system = 3;
  string host_architecture = 4;
  int32 assurance = 5;
  bool available = 6;
  string unavailable_reason = 7;
  string certification_json = 8;
}

message CreateWorkloadRequest {
  string provider_id = 1;
  string workload_id = 2;
  int32 workload_kind = 3;
  string guest_image_id = 4;
  string guest_image_version = 5;
  string guest_image_digest = 6;
  string guest_operating_system = 7;
  string guest_architecture = 8;
  ResourceLimits resource_limits = 9;
  BrokerLease broker_lease = 10;
  BuilderSpec builder = 11;
  RuntimeSpec runtime = 12;
}

message ResourceLimits {
  int32 virtual_cpu_count = 1;
  int32 cpu_percent = 2;
  int32 memory_megabytes = 3;
  int32 writable_disk_megabytes = 4;
  int32 maximum_process_count = 5;
  int32 maximum_log_bytes = 6;
  int64 maximum_duration_seconds = 7;
}

message BrokerLease {
  string channel_id = 1;
  string protocol_version = 2;
  string boot_token = 3;
  string expected_guest_image_digest = 4;
  string expected_artifact_digest = 5;
  int64 expires_at_unix_seconds = 6;
}

message BuilderSpec {
  string repository_url = 1;
  string commit_sha = 2;
  bool include_submodules = 3;
  string build_profile_id = 4;
  string build_profile_version = 5;
  int64 maximum_artifact_bytes = 6;
}

message RuntimeSpec {
  string artifact_digest = 1;
  string artifact_signature = 2;
  string artifact_format_version = 3;
  string artifact_operating_system = 4;
  string artifact_architecture = 5;
  repeated string entrypoint = 6;
  string installation_id = 7;
  string business_id = 8;
  string tick_id = 9;
}

message WorkloadOperationRequest {
  string provider_id = 1;
  string workload_id = 2;
  string provider_instance_id = 3;
  int32 workload_kind = 4;
}

message StopWorkloadRequest {
  WorkloadOperationRequest workload = 1;
  int32 grace_period_seconds = 2;
}

message WorkloadHandleResponse {
  bool success = 1;
  string error_code = 2;
  string sanitized_error = 3;
  WorkloadOperationRequest workload = 4;
}

message WorkloadStatusResponse {
  bool found = 1;
  WorkloadOperationRequest workload = 2;
  int32 state = 3;
  int32 termination_reason = 4;
  optional int32 exit_code = 5;
  int64 started_at_unix_milliseconds = 6;
  int64 finished_at_unix_milliseconds = 7;
  string error_code = 8;
  string sanitized_error = 9;
}

message OperationResponse {
  bool success = 1;
  string error_code = 2;
  string sanitized_error = 3;
}

message ReadLogsRequest {
  WorkloadOperationRequest workload = 1;
  int32 maximum_bytes = 2;
}

message LogChunk {
  int64 occurred_at_unix_milliseconds = 1;
  string stream = 2;
  bytes content = 3;
  bool truncated = 4;
  bool completed = 5;
}
