<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the shell read env(safe-area-inset-*) on notched phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>C-Sweet</title>
    <base href="/" />
    <script src="_content/CSweet.UI/js/themeCatalog.js"></script>
    <script src="_content/CSweet.UI/js/appearance.js"></script>
    <link rel="preload" id="webassembly" />

    <!-- Inter is self-hosted (see theme.css @font-face): no third-party request on
         first paint, and the UI still renders on an air-gapped install. -->
    <link rel="preload" href="_content/CSweet.UI/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="_content/CSweet.UI/css/theme.css" />
    <link rel="stylesheet" href="_content/CSweet.UI/css/app.css" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link href="_content/CSweet.UI/CSweet.UI.bundle.scp.css" rel="stylesheet" />
    <!-- Chrome loads last: it is the final word on how the product looks. -->
    <link rel="stylesheet" href="_content/CSweet.UI/css/chrome.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <noscript>
        <p style="max-width:34rem;margin:4rem auto;padding:0 1.5rem;font:400 1rem/1.6 system-ui,sans-serif;color:var(--ink,#18233f)">
            C-Sweet is a client-side application and needs JavaScript to start.
            Enable it and reload this page.
        </p>
    </noscript>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">Dismiss</span>
    </div>

    <!-- Boot watchdog. A successful Blazor boot *replaces* everything inside #app,
         so if the spinner is still there after 12s the runtime never arrived
         (offline, dead tunnel, failed deploy). Say so instead of spinning forever. -->
    <script>
        (function () {
            window.setTimeout(function () {
                if (!document.querySelector("#app .loading-progress")) return;
                var app = document.getElementById("app");
                var text = app && app.querySelector(".loading-progress-text");
                if (!app || !text) return;
                app.classList.add("boot-failed");
                text.innerHTML = "C-Sweet isn\u2019t responding. Check that the launcher window is still running. " +
                    "<a class=\"boot-retry\" href=\".\">Reload</a>";
            }, 12000);
        })();
    </script>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
