<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C-Sweet · Cinematic promo studio</title><link rel="stylesheet" href="studio.css"></head>
<body>
<header class="studio-header"><div><strong>C-Sweet</strong><span>Promo studio</span></div><nav><label>Campaign <select id="campaign"><option value="software">Software · Northstar</option><option value="youtube">YouTube · Signal</option><option value="game">Game · Orbit</option></select></label><label>Format <select id="format"><option value="landscape">Landscape · 50s</option><option value="vertical">Vertical · 25s</option></select></label></nav></header>

<p class="studio-note">Fictional demo businesses · real C-Sweet components · condensed workflows. Space: play/pause. Arrow keys: step one frame.</p>
<audio id="audio" preload="auto"></audio><script type="module" src="stage.ts"></script>
