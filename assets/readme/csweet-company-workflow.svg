eight="600" >Company memory</text><text x="74" y="577" font-size="21" fill="#72667d" font-weight="400" >Keep the decisions.</text><text x="74" y="610" font-size="21" fill="#72667d" font-weight="400" >Inform the next assignment.</text></g></svg>