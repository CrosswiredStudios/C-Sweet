<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">C-Sweet security architecture</title>
  <desc id="desc">C-Sweet Headquarters applies identity, policy, approvals, and audit controls before bounded work reaches hardware-isolated agents in an Office.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffcf7"/>
      <stop offset="1" stop-color="#f3faf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#18233f" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="28" fill="url(#background)"/>
  <circle cx="805" cy="260" r="178" fill="none" stroke="#9be7c2" stroke-width="2" stroke-dasharray="8 12" opacity=".8"/>
  <circle cx="805" cy="260" r="125" fill="none" stroke="#23845c" stroke-width="2" stroke-dasharray="5 10" opacity=".25"/>

  <text x="80" y="80" fill="#23845c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="3">SECURITY IS AN OPERATING MODEL</text>
  <text x="80" y="126" fill="#18233f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800">Authority stays explicit from intent to execution.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="185" width="410" height="250" rx="22" fill="#ffffff" stroke="#e2ddd5" stroke-width="2"/>
    <rect x="80" y="185" width="410" height="13" rx="7" fill="#18233f"/>
    <rect x="116" y="226" width="58" height="58" rx="16" fill="#18233f"/>
    <text x="145" y="264" fill="#ffffff" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">HQ</text>
    <text x="194" y="247" fill="#18233f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800">C-Sweet Headquarters</text>
    <text x="194" y="276" fill="#68738a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Your trusted control plane</text>
    <circle cx="126" cy="330" r="6" fill="#23845c"/>
    <text x="146" y="337" fill="#37435d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Identity and tenant boundaries</text>
    <circle cx="126" cy="370" r="6" fill="#23845c"/>
    <text x="146" y="377" fill="#37435d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Capability grants and approvals</text>
    <circle cx="126" cy="410" r="6" fill="#23845c"/>
    <text x="146" y="417" fill="#37435d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Durable audit and revocation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="595" y="204" width="420" height="210" rx="105" fill="#0b2e53"/>
    <circle cx="805" cy="257" r="24" fill="#9be7c2"/>
    <path d="M794 257l8 8 16-19" fill="none" stroke="#0b2e53" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="805" y="310" fill="#ffffff" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800">Policy broker</text>
    <text x="805" y="342" fill="#c9d6e1" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Schema-bound • scope-bound • fail-closed</text>
    <text x="805" y="372" fill="#9be7c2" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">No raw infrastructure authority</text>
  </g>

  <path d="M490 310h84" fill="none" stroke="#23845c" stroke-width="4" stroke-linecap="round"/>
  <path d="M559 299l15 11-15 11" fill="none" stroke="#23845c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1015 310h84" fill="none" stroke="#23845c" stroke-width="4" stroke-linecap="round"/>
  <path d="M1084 299l15 11-15 11" fill="none" stroke="#23845c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="1110" y="185" width="410" height="250" rx="22" fill="#ffffff" stroke="#e2ddd5" stroke-width="2"/>
    <rect x="1110" y="185" width="410" height="13" rx="7" fill="#23845c"/>
    <rect x="1146" y="226" width="58" height="58" rx="16" fill="#dff6eb"/>
    <path d="M1161 260h28M1167 248h16M1167 272h16" fill="none" stroke="#23845c" stroke-width="5" stroke-linecap="round"/>
    <text x="1224" y="247" fill="#18233f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800">Office</text>
    <text x="1224" y="276" fill="#68738a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Independently installed execution plane</text>
    <circle cx="1156" cy="330" r="6" fill="#23845c"/>
    <text x="1176" y="337" fill="#37435d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Certified hardware VM boundary</text>
    <circle cx="1156" cy="370" r="6" fill="#23845c"/>
    <text x="1176" y="377" fill="#37435d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">No guest network device</text>
    <circle cx="1156" cy="410" r="6" fill="#23845c"/>
    <text x="1176" y="417" fill="#37435d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Ephemeral workload state</text>
  </g>

  <rect x="1180" y="60" width="340" height="54" rx="27" fill="#fff8e7" stroke="#f2b84b"/>
  <circle cx="1210" cy="87" r="7" fill="#f2b84b"/>
  <text x="1230" y="94" fill="#18233f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Cloud optional. Control stays yours.</text>
</svg>
