<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
<title id="title">C-Sweet authority and execution boundary</title><desc id="desc">You set direction. Headquarters governs identity, capabilities, approvals and company state. Office supplies certified hardware-isolated execution. Docker is trusted development infrastructure.</desc>
<defs>
 <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f1ecfb"/><stop offset=".6" stop-color="#fbfaff"/><stop offset="1" stop-color="#edf7f5"/></linearGradient>
 <radialGradient id="lavender"><stop stop-color="#c5c1f2" stop-opacity=".62"/><stop offset="1" stop-color="#c5c1f2" stop-opacity="0"/></radialGradient>
 <radialGradient id="pink"><stop stop-color="#eac2dd" stop-opacity=".46"/><stop offset="1" stop-color="#eac2dd" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-10%" y="-15%" width="120%" height="145%"><feDropShadow dy="8" stdDeviation="12" flood-color="#735090" flood-opacity=".09"/></filter>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a28bbb"/></marker>
</defs>
<rect width="1440" height="680" rx="28" fill="url(#paper)"/>
<circle cx="216.0" cy="136.0" r="576.0" fill="url(#lavender)"/><circle cx="1353.6" cy="95.2" r="547.2" fill="url(#pink)"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="54" font-size="17" fill="#735090" font-weight="650" letter-spacing="3">YOUR COMPANY, YOUR CONTROL</text><text x="48" y="108" font-size="43" fill="#30263f" font-weight="600" >Authority stays explicit.</text><text x="48" y="148" font-size="23" fill="#72667d" font-weight="400" >You lead. Headquarters governs. Office executes within a boundary.</text><rect x="48" y="208" width="384" height="294" rx="24" fill="#fbfaff" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/><text x="74" y="245" font-size="18" fill="#735090" font-weight="650" letter-spacing="2">01</text><text x="74" y="296" font-size="32" fill="#30263f" font-weight="600" >You</text><text x="74" y="332" font-size="21" fill="#735090" font-weight="550" >Direction &amp; decisions</text><text x="74" y="382" font-size="20" fill="#72667d" font-weight="400" >Define the outcome</text><text x="74" y="413" font-size="20" fill="#72667d" font-weight="400" >Review plans and results</text><text x="74" y="444" font-size="20" fill="#72667d" font-weight="400" >Choose permissions and policy</text><rect x="528" y="208" width="384" height="294" rx="24" fill="#30263f" stroke="#473553" stroke-width="2" filter="url(#shadow)"/><text x="554" y="245" font-size="18" fill="#cbb5ef" font-weight="650" letter-spacing="2">02</text><text x="554" y="296" font-size="32" fill="#fbfaff" font-weight="600" >Headquarters</text><text x="554" y="332" font-size="21" fill="#cbb5ef" font-weight="550" >Company state &amp; policy</text><text x="554" y="382" font-size="20" fill="#e0d7ea" font-weight="400" >Identity and capability grants</text><text x="554" y="413" font-size="20" fill="#e0d7ea" font-weight="400" >Approvals, quotas and audit</text><text x="554" y="444" font-size="20" fill="#e0d7ea" font-weight="400" >Storage and brokered access</text><rect x="1008" y="208" width="384" height="294" rx="24" fill="#fbfaff" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/><text x="1034" y="245" font-size="18" fill="#735090" font-weight="650" letter-spacing="2">03</text><text x="1034" y="296" font-size="32" fill="#30263f" font-weight="600" >Office</text><text x="1034" y="332" font-size="21" fill="#735090" font-weight="550" >Separate execution plane</text><text x="1034" y="382" font-size="20" fill="#72667d" font-weight="400" >Independent installation</text><text x="1034" y="413" font-size="20" fill="#72667d" font-weight="400" >Current builder/runtime certification</text><text x="1034" y="444" font-size="20" fill="#72667d" font-weight="400" >Hardware-isolated agent guests</text><g fill="none" stroke="#a28bbb" stroke-width="2" marker-end="url(#arrow)"><path d="M438 355H514"/><path d="M918 330H994"/><path d="M1002 388H926"/></g><text x="960" y="296" font-size="17" fill="#735090" font-weight="550" text-anchor="middle">Work</text><text x="960" y="423" font-size="17" fill="#735090" font-weight="550" text-anchor="middle">Evidence</text><rect x="48" y="552" width="1344" height="80" rx="20" fill="#ffffff8f" stroke="#ffffff"/><text x="78" y="585" font-size="15" fill="#735090" font-weight="650" letter-spacing="2">TRUSTED DEVELOPMENT INFRASTRUCTURE</text><text x="78" y="614" font-size="21" fill="#72667d" font-weight="400" >Docker / PostgreSQL support Headquarters. Untrusted agents run in a separately enrolled Office.</text></g></svg>