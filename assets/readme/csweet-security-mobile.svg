<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1310" viewBox="0 0 720 1310" role="img" aria-labelledby="title desc">
<title id="title">C-Sweet authority and execution boundary</title><desc id="desc">You set direction. Headquarters governs identity, capabilities, approvals and company state. Office supplies certified hardware-isolated execution. Docker is trusted development infrastructure.</desc>
<defs>
 <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f1ecfb"/><stop offset=".6" stop-color="#fbfaff"/><stop offset="1" stop-color="#edf7f5"/></linearGradient>
 <radialGradient id="lavender"><stop stop-color="#c5c1f2" stop-opacity=".62"/><stop offset="1" stop-color="#c5c1f2" stop-opacity="0"/></radialGradient>
 <radialGradient id="pink"><stop stop-color="#eac2dd" stop-opacity=".46"/><stop offset="1" stop-color="#eac2dd" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-10%" y="-15%" width="120%" height="145%"><feDropShadow dy="8" stdDeviation="12" flood-color="#735090" flood-opacity=".09"/></filter>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a28bbb"/></marker>
</defs>
<rect width="720" height="1310" rx="28" fill="url(#paper)"/>
<circle cx="108.0" cy="262.0" r="288.0" fill="url(#lavender)"/><circle cx="676.8" cy="183.4" r="273.6" fill="url(#pink)"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="54" font-size="17" fill="#735090" font-weight="650" letter-spacing="3">YOUR COMPANY, YOUR CONTROL</text><text x="48" y="108" font-size="43" fill="#30263f" font-weight="600" >Authority stays explicit.</text><rect x="48" y="176" width="624" height="256" rx="24" fill="#fbfaff" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/><text x="74" y="213" font-size="18" fill="#735090" font-weight="650" letter-spacing="2">01</text><text x="74" y="264" font-size="35" fill="#30263f" font-weight="600" >You</text><text x="74" y="300" font-size="24" fill="#735090" font-weight="550" >Direction &amp; decisions</text><text x="74" y="350" font-size="23" fill="#72667d" font-weight="400" >Define the outcome</text><text x="74" y="381" font-size="23" fill="#72667d" font-weight="400" >Review plans and results</text><text x="74" y="412" font-size="23" fill="#72667d" font-weight="400" >Choose permissions and policy</text><rect x="48" y="526" width="624" height="256" rx="24" fill="#30263f" stroke="#473553" stroke-width="2" filter="url(#shadow)"/><text x="74" y="563" font-size="18" fill="#cbb5ef" font-weight="650" letter-spacing="2">02</text><text x="74" y="614" font-size="35" fill="#fbfaff" font-weight="600" >Headquarters</text><text x="74" y="650" font-size="24" fill="#cbb5ef" font-weight="550" >Company state &amp; policy</text><text x="74" y="700" font-size="23" fill="#e0d7ea" font-weight="400" >Identity and capability grants</text><text x="74" y="731" font-size="23" fill="#e0d7ea" font-weight="400" >Approvals, quotas and audit</text><text x="74" y="762" font-size="23" fill="#e0d7ea" font-weight="400" >Storage and brokered access</text><rect x="48" y="876" width="624" height="256" rx="24" fill="#fbfaff" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/><text x="74" y="913" font-size="18" fill="#735090" font-weight="650" letter-spacing="2">03</text><text x="74" y="964" font-size="35" fill="#30263f" font-weight="600" >Office</text><text x="74" y="1000" font-size="24" fill="#735090" font-weight="550" >Separate execution plane</text><text x="74" y="1050" font-size="23" fill="#72667d" font-weight="400" >Independent installation</text><text x="74" y="1081" font-size="23" fill="#72667d" font-weight="400" >Current builder/runtime certification</text><text x="74" y="1112" font-size="23" fill="#72667d" font-weight="400" >Hardware-isolated agent guests</text><path d="M360 446V512" fill="none" stroke="#a28bbb" stroke-width="2" marker-end="url(#arrow)"/><rect x="100" y="465" width="520" height="34" rx="12" fill="#f6f3fb"/><text x="360" y="490" font-size="23" fill="#735090" font-weight="500" text-anchor="middle">Direction and reviewed decisions</text><path d="M360 796V862" fill="none" stroke="#a28bbb" stroke-width="2" marker-end="url(#arrow)"/><rect x="100" y="815" width="520" height="34" rx="12" fill="#f6f3fb"/><text x="360" y="840" font-size="23" fill="#735090" font-weight="500" text-anchor="middle">Bounded work and return evidence</text><text x="48" y="1205" font-size="24" fill="#735090" font-weight="550" >Docker runs trusted development infrastructure.</text><text x="48" y="1250" font-size="24" fill="#72667d" font-weight="400" >Untrusted execution requires a ready Office.</text></g></svg>