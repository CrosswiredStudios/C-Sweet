><text x="144" y="1093" font-size="24" fill="#72667d" font-weight="400" >Inform the next assignment.</text><text x="48" y="1184" font-size="25" fill="#735090" font-weight="600" >Keep learning. Refine the next direction.</text><text x="48" y="1225" font-size="21" fill="#72667d" font-weight="400" >Execution depends on setup and granted capabilities.</text></g></svg>