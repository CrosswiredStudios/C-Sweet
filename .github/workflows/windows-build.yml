name: Windows build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (for example 0.1.0-preview.1; blank uses 0.0.0-ci.RUN)'
        required: false
        type: string
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'scripts/release/**'
      - 'docs/deployment/windows-build.md'

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_PACKAGES: ${{ runner.temp }}/csweet-nuget
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build Windows distribution
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          ./scripts/release/Build-WindowsDistribution.ps1 -Version $version
      - name: Upload Windows ZIP and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csweet-win-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/windows/*.zip
            artifacts/windows/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
