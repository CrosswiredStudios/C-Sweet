name: Office release installer tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/office-release-tests.yml'
      - 'src/CSweet.Api/Setup/CSweet.OfficeRelease.ps1'
      - 'tests/OfficeRelease.Tests.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/office-release-tests.yml'
      - 'src/CSweet.Api/Setup/CSweet.OfficeRelease.ps1'
      - 'tests/OfficeRelease.Tests.ps1'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify release discovery, multipart integrity and extraction
        shell: pwsh
        run: ./tests/OfficeRelease.Tests.ps1
      - name: Verify Windows PowerShell 5.1 installer compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/OfficeRelease.Tests.ps1
