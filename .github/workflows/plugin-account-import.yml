name: Account import diagnostics
on:
  pull_request:
    paths:
      - 'src/CSweet.Contracts/Plugins/**'
      - 'src/CSweet.Domain/Setup/PluginAccount*'
      - 'src/CSweet.Infrastructure/Setup/PluginAccount*'
      - 'src/CSweet.Infrastructure/Setup/Connector*'
      - 'src/CSweet.Infrastructure/Setup/ManagedConnectorRelay.cs'
      - 'src/CSweet.Infrastructure/Setup/ManagedPluginConnectionGateway.cs'
      - 'src/CSweet.Infrastructure/Setup/ManagedConnectionHostConfiguration.cs'
      - 'src/CSweet.Infrastructure/DependencyInjection.cs'
      - 'src/CSweet.AppHost/**'
      - 'src/CSweet.Infrastructure/Persistence/**'
      - 'src/CSweet.Api/Agents/PluginAccountEndpoints.cs'
      - 'src/CSweet.UI/Pages/PluginManage.razor*'
      - 'src/CSweet.UI/Components/PluginSetup*'
      - 'src/CSweet.UI/Components/PluginConnectionNotice.razor'
      - 'src/CSweet.UI/Services/PluginSetupPresentation.cs'
      - 'tests/CSweet.PluginAccount.AcceptanceHarness/**'
      - 'src/CSweet.UI/Components/PluginImportDiagnostics.razor'
      - 'src/CSweet.UI/Services/PluginAccountApiClient.cs'
      - 'tests/CSweet.UnitTests/*Plugin*'
      - 'tests/CSweet.UnitTests/Connector*'
      - 'tests/CSweet.UnitTests/ManagedConnectorRelayTests.cs'
      - 'tests/CSweet.UnitTests/AppHostManagedConnectionConfigurationTests.cs'
      - 'Directory.*.props'
      - '.github/workflows/plugin-account-import.yml'
permissions:
  contents: read
jobs:
  import-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Test account authority, import diagnostics, receipts and UI
        run: >-
          dotnet test tests/CSweet.UnitTests/CSweet.UnitTests.csproj
          --configuration Release
          --filter 'FullyQualifiedName~PluginAccount|FullyQualifiedName~PluginImport|FullyQualifiedName~ManagedPluginAccountFlowTests|FullyQualifiedName~PluginManageConnectionTests|FullyQualifiedName~PluginSetupPresentationTests|FullyQualifiedName~PluginSettingsTests|FullyQualifiedName~PluginProviderAdministrationTests|FullyQualifiedName~PluginSetupEndpointStartupTests|FullyQualifiedName~AppHostManagedConnectionConfigurationTests|FullyQualifiedName~ManagedDeploymentPairingTests|FullyQualifiedName~AppHostExecutionGatewayWiringTests|FullyQualifiedName~CSweet.UnitTests.Connector|FullyQualifiedName~ManagedConnectorRelayTests'
          -p:UseLocalCSweetMemory=false -p:UseLocalCSweetAgentSdk=false
          -p:UseLocalCSweetWorkManagementContracts=false -p:UseLocalOfficeContracts=false
          -p:UseLocalIsolation=false -p:UseSharedCompilation=false -m:1 -nr:false
      - name: Compile shared AppHost configuration wiring
        run: >-
          dotnet build src/CSweet.AppHost/CSweet.AppHost.csproj --configuration Release --no-dependencies
          -p:UseLocalCSweetMemory=false -p:UseLocalCSweetAgentSdk=false
          -p:UseLocalCSweetWorkManagementContracts=false -p:UseLocalOfficeContracts=false
          -p:UseLocalIsolation=false -p:UseSharedCompilation=false -m:1 -nr:false
