# Shared by Aspire and Docker Compose. Search engines remain upstream-maintained.
use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - brave

general:
  instance_name: C-Sweet Search

search:
  formats:
    - html
    - json

server:
  # Private platform service; a public instance's bot limiter would block agents.
  limiter: false
  public_instance: false
  image_proxy: false
  # SEARXNG_SECRET is generated by start.sh before the upstream entrypoint runs.

engines:
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
